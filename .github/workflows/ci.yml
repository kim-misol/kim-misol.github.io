name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16' # Node.js 버전

    - name: Install dependencies
      run: yarn install

    - name: Run ESLint
      run: yarn lint

    - name: Run Stylelint
      run: yarn stylelint "**/*.css"

    - name: Run tests
      run: yarn test

    - name: Build the project
      run: yarn build
